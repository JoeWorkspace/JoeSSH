# Standalone workspace so the heavy Tauri/WebView2 dependency tree does not
# burden the root workspace's `cargo test` / sync CI lane.
[workspace]

[package]
name = "atlasterm-desktop-shell"
version = "0.1.0-beta.25"
edition = "2021"
license = "MIT"
rust-version = "1.96"

[lib]
name = "atlasterm_desktop_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The Store build uses a reviewed local Tauri patch that disables the unused
# Windows self-relaunch path. Stock Tauri links CreateProcessW for that path,
# which makes an otherwise clean packaged desktop app fail WACK's blocked
# executable test. JoeSSH does not expose or call Tauri's restart API.
tauri = { path = "../../../vendor/tauri-2.11.2", default-features = false, features = ["wry", "compression", "dynamic-acl", "x11", "dbus"] }
atlasterm-core = { path = "../../../crates/core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18.5"

[[test]]
name = "variant_str_iter"
path = "../../../vendor/glib-0.18.5/tests/variant_str_iter.rs"

# GTK3 requires glib 0.18. Use the official crate with the narrowly scoped
# upstream RUSTSEC-2024-0429 fix until Tauri can use the maintained GTK stack.
[patch.crates-io]
glib = { path = "../../../vendor/glib-0.18.5" }
