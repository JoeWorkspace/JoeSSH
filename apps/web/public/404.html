<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101820" />
    <meta name="color-scheme" content="dark light" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>JoeSSH — Page Not Found</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #0d1117;
        color: #e6edf3;
        text-align: center;
        padding: 2rem;
      }
      .card {
        width: 100%;
        max-width: 400px;
        overflow-wrap: anywhere;
      }
      .icon {
        font-size: 3rem;
        margin-bottom: 1rem;
      }
      .status-code {
        color: #6e7681;
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 0.5rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      p {
        color: #8b949e;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }
      a {
        display: inline-block;
        background: #238636;
        color: #fff;
        min-height: 44px;
        min-width: 44px;
        max-width: 100%;
        padding: 0.75rem 1.5rem;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 500;
        line-height: 1.2;
        text-decoration: none;
        white-space: normal;
        transition: background 0.2s;
      }
      a:hover { background: #2ea043; }
      a:focus-visible {
        outline: 2px solid #58a6ff;
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        a { transition: none; }
      }
      @media (forced-colors: active) {
        a { border: 1px solid ButtonText; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">🔍</div>
      <p class="status-code">404</p>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <a href="/">Go to Dashboard</a>
    </main>
  </body>
</html>
