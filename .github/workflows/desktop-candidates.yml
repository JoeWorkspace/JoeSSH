name: Desktop Unsigned Candidates

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build; leave blank to use the selected workflow ref
        required: false
        type: string

concurrency:
  group: desktop-unsigned-candidates-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source-gate:
    name: Source gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:desktop
      - run: npm run test:desktop
      - run: npm run qa:desktop-release-package
      - run: npm run qa:desktop-release-evidence
      - run: npm run test:desktop-candidate-stage

  build-candidate:
    name: ${{ matrix.platform }} unsigned candidate
    needs: source-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Capture checked-out source commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install Linux bundle dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run release:desktop:build
      - name: Stage explicitly unsigned candidate
        run: node scripts/stage-desktop-candidate.mjs --platform ${{ matrix.platform }} --source-commit ${{ steps.source.outputs.commit }}
      - name: Verify staged candidate before upload
        run: npm run release:desktop:verify-candidate -- --platform ${{ matrix.platform }} --source-commit ${{ steps.source.outputs.commit }}
      - name: Upload unsigned candidate
        uses: actions/upload-artifact@v4
        with:
          name: joessh-${{ matrix.platform }}-unsigned-candidate
          path: reports/candidates/desktop/${{ matrix.platform }}-unsigned/
          if-no-files-found: error
          retention-days: 7
