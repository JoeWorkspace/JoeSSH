name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: npm
      - name: Pin npm 10.9.7
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.7
          test "$(npm --version)" = "10.9.7"
      - name: Install pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          readonly asset_url="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          readonly archive="${RUNNER_TEMP}/gitleaks_8.30.1_linux_x64.tar.gz"
          readonly bin_dir="${RUNNER_TEMP}/gitleaks-bin"
          readonly gitleaks_bin="${bin_dir}/gitleaks"

          curl --fail --silent --show-error --location \
            --proto "=https" \
            --tlsv1.2 \
            --output "${archive}" \
            "${asset_url}"
          printf "%s  %s\n" "${GITLEAKS_LINUX_X64_SHA256}" "${archive}" |
            sha256sum --check --strict -

          mkdir -p "${bin_dir}"
          tar --extract --gzip --file "${archive}" --directory "${bin_dir}" gitleaks
          chmod 0755 "${gitleaks_bin}"
          actual_version="$("${gitleaks_bin}" version | tr -d "\r")"
          if [[ "${actual_version}" != "${GITLEAKS_VERSION}" ]]; then
            printf "Expected Gitleaks %s, got %s.\n" \
              "${GITLEAKS_VERSION}" "${actual_version}" >&2
            exit 1
          fi
      - name: Scan full Git history before dependency installation
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_CONFIG_SHA256: "17692ae221e51b1fe8fa4cd7862e02258d23a8873fc75ebd12251a0372fa2dfe"
          GITLEAKS_IGNORE_SHA256: "a60c709073214edf6582b7cb911364b184743516b30a4970493195d04ee47ccf"
        run: |
          set -euo pipefail
          readonly gitleaks_bin="${RUNNER_TEMP}/gitleaks-bin/gitleaks"

          printf "%s  %s\n" "${GITLEAKS_CONFIG_SHA256}" "${GITHUB_WORKSPACE}/.gitleaks.toml" |
            sha256sum --check --strict -
          printf "%s  %s\n" "${GITLEAKS_IGNORE_SHA256}" "${GITHUB_WORKSPACE}/.gitleaksignore" |
            sha256sum --check --strict -

          actual_version="$("${gitleaks_bin}" version | tr -d "\r")"
          if [[ "${actual_version}" != "${GITLEAKS_VERSION}" ]]; then
            printf "Expected Gitleaks %s, got %s.\n" \
              "${GITLEAKS_VERSION}" "${actual_version}" >&2
            exit 1
          fi
          "${gitleaks_bin}" git \
            --redact=100 \
            --no-banner \
            --no-color \
            --config="${GITHUB_WORKSPACE}/.gitleaks.toml" \
            --gitleaks-ignore-path="${GITHUB_WORKSPACE}/.gitleaksignore" \
            --log-opts=--all \
            "${GITHUB_WORKSPACE}"
      - run: npm ci
      - run: npm run qa:package-lock-portability
      - run: npm run lint
      - run: npm run qa:accessibility-readiness
      - run: npm run qa:handoff-hygiene
      - run: npm run qa:artifact-checksums
      - run: npm run qa:desktop-release-package
      - run: npm run qa:desktop-release-evidence
      - run: npm run qa:desktop-release-secrets
      - run: npm run qa:desktop-release-diagnostics
      - run: npm run qa:desktop-release-parity
      - run: npm run qa:desktop-release-evidence-download
      - run: npm run qa:desktop-release-evidence-preflight
      - run: npm run qa:sync-release-package
      - run: npm run qa:sync-release-evidence
      - run: npm run qa:web-release
      - run: npm run qa:release-sbom
      - run: npm run qa:third-party-licenses
      - run: npm run qa:release-draft
      - run: npm run qa:release-publish-preflight
      - run: npm run qa:release-preparation
        env:
          JOESSH_GITLEAKS_COMMAND: ${{ runner.temp }}/gitleaks-bin/gitleaks
      - run: npm run qa:lighthouse-audit
      - run: npm run test:web-admin-bundle-token-scan

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: npm
      - name: Pin npm 10.9.7
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.7
          test "$(npm --version)" = "10.9.7"
      - run: npm ci
      - run: npm run typecheck

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: npm
      - name: Pin npm 10.9.7
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.7
          test "$(npm --version)" = "10.9.7"
      - run: npm ci
      - run: npx --no-install vitest run --coverage
      - name: Upload coverage
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 3

  test-mobile:
    name: Mobile Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: npm
      - name: Pin npm 10.9.7
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.7
          test "$(npm --version)" = "10.9.7"
      - run: npm ci
      - run: npm test -w @atlasterm/mobile

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: npm
      - name: Pin npm 10.9.7
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.7
          test "$(npm --version)" = "10.9.7"
      - run: npm ci
      - run: npm run build
      - run: npm run qa:bundle-size
      - run: npm run qa:subresource-integrity
      - run: npm run qa:security-headers
      - run: npm run qa:i18n-release
      - run: npm run qa:sync-api-docs

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: npm
      - name: Pin npm 10.9.7
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.7
          test "$(npm --version)" = "10.9.7"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run qa:windows-store-surfaces:runtime:installed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        continue-on-error: true
        with:
          name: store-runtime-report-${{ runner.os }}
          path: tests/e2e/test-results/store-runtime/
          if-no-files-found: ignore
          retention-days: 3
      - run: npm run qa:e2e:fresh
      - run: npm run qa:e2e:web-real-sync:fresh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 3

  store-runtime-windows:
    name: Store Runtime Windows
    runs-on: windows-2025
    timeout-minutes: 30
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
      - name: Pin npm 10.9.7
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.7
          test "$(npm --version)" = "10.9.7"
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install chromium
      - run: npm run qa:windows-store-surfaces:runtime:installed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        continue-on-error: true
        with:
          name: store-runtime-report-${{ runner.os }}
          path: tests/e2e/test-results/store-runtime/
          if-no-files-found: ignore
          retention-days: 3

  visual-qa:
    name: Visual QA
    runs-on: windows-latest
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: npm
      - name: Pin npm 10.9.7
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.7
          test "$(npm --version)" = "10.9.7"
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-visual-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx --no-install playwright install chromium
      - run: npm run qa:e2e:visual:fresh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        continue-on-error: true
        with:
          name: visual-qa-report
          path: tests/e2e/test-results/
          retention-days: 3

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: npm
      - name: Pin npm 10.9.7
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.7
          test "$(npm --version)" = "10.9.7"
      - run: npm ci
      - run: npm run qa:prod-audit

  rust:
    name: Rust Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo audit --deny warnings

  desktop-real-ssh-smoke:
    name: Desktop Real SSH Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: npm
      - name: Pin npm 10.9.7
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.7
          test "$(npm --version)" = "10.9.7"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install OpenSSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
      - name: Start loopback OpenSSH fixture
        run: |
          set -euo pipefail
          sudo useradd --create-home --shell /bin/bash joessh-smoke
          echo "joessh-smoke:${JOESSH_REAL_SSH_PASSWORD}" | sudo chpasswd
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd \
            -D \
            -e \
            -p "${JOESSH_REAL_SSH_PORT}" \
            -o ListenAddress=127.0.0.1 \
            -o PasswordAuthentication=yes \
            -o PubkeyAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o PermitRootLogin=no \
            -o AllowUsers=joessh-smoke \
            -o StrictModes=no \
            >"${RUNNER_TEMP}/joessh-sshd.log" 2>&1 &
          echo $! >"${RUNNER_TEMP}/joessh-sshd.pid"
          for attempt in {1..30}; do
            if timeout 1 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/${JOESSH_REAL_SSH_PORT}"; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/joessh-sshd.log"
          exit 1
        env:
          JOESSH_REAL_SSH_PORT: "2222"
          JOESSH_REAL_SSH_PASSWORD: ${{ secrets.JOESSH_REAL_SSH_PASSWORD || 'joessh-ci-smoke-password' }}
      - run: npm ci
      - name: Run real SSH Desktop dogfood smoke
        run: npm run qa:desktop:real-ssh-smoke
        env:
          JOESSH_REAL_SSH_SMOKE: "1"
          JOESSH_REAL_SSH_HOST: 127.0.0.1
          JOESSH_REAL_SSH_PORT: "2222"
          JOESSH_REAL_SSH_USERNAME: joessh-smoke
          JOESSH_REAL_SSH_PASSWORD: ${{ secrets.JOESSH_REAL_SSH_PASSWORD || 'joessh-ci-smoke-password' }}
          JOESSH_REAL_SSH_REMOTE_DIR: /home/joessh-smoke
      - name: Upload sshd log
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-real-ssh-smoke-sshd-log
          path: ${{ runner.temp }}/joessh-sshd.log
          retention-days: 3

  tauri-shell:
    name: Tauri Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: npm
      - name: Pin npm 10.9.7
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.7
          test "$(npm --version)" = "10.9.7"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: npm ci
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm run qa:tauri

  public-release-readiness:
    name: Public Release Readiness
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      [
        lint,
        typecheck,
        test-unit,
        test-mobile,
        build,
        test-e2e,
        store-runtime-windows,
        visual-qa,
        security-audit,
        rust,
        desktop-real-ssh-smoke,
        tauri-shell,
        lighthouse,
      ]
    steps:
      - name: Require every prerequisite job to succeed
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_UNIT_RESULT: ${{ needs.test-unit.result }}
          TEST_MOBILE_RESULT: ${{ needs.test-mobile.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_E2E_RESULT: ${{ needs.test-e2e.result }}
          STORE_RUNTIME_WINDOWS_RESULT: ${{ needs.store-runtime-windows.result }}
          VISUAL_QA_RESULT: ${{ needs.visual-qa.result }}
          SECURITY_AUDIT_RESULT: ${{ needs.security-audit.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          DESKTOP_REAL_SSH_SMOKE_RESULT: ${{ needs.desktop-real-ssh-smoke.result }}
          TAURI_SHELL_RESULT: ${{ needs.tauri-shell.result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
        run: |
          set -euo pipefail
          failed=()
          require_success() {
            local job="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              failed+=("${job}=${result}")
            fi
          }
          require_success "lint" "${LINT_RESULT}"
          require_success "typecheck" "${TYPECHECK_RESULT}"
          require_success "test-unit" "${TEST_UNIT_RESULT}"
          require_success "test-mobile" "${TEST_MOBILE_RESULT}"
          require_success "build" "${BUILD_RESULT}"
          require_success "test-e2e" "${TEST_E2E_RESULT}"
          require_success "store-runtime-windows" "${STORE_RUNTIME_WINDOWS_RESULT}"
          require_success "visual-qa" "${VISUAL_QA_RESULT}"
          require_success "security-audit" "${SECURITY_AUDIT_RESULT}"
          require_success "rust" "${RUST_RESULT}"
          require_success "desktop-real-ssh-smoke" "${DESKTOP_REAL_SSH_SMOKE_RESULT}"
          require_success "tauri-shell" "${TAURI_SHELL_RESULT}"
          require_success "lighthouse" "${LIGHTHOUSE_RESULT}"
          if (( ${#failed[@]} != 0 )); then
            printf 'Public Release Readiness blocked by prerequisite results:\n' >&2
            printf ' - %s\n' "${failed[@]}" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: npm
      - name: Pin npm 10.9.7
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.7
          test "$(npm --version)" = "10.9.7"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: npm ci
      - run: npm run qa:source-prerelease
      - run: npm run qa:mobile:native-preflight
      - run: npm run qa:mobile-public-env
      - run: npm run release:sbom
      - run: npm run release:sbom:verify
      - run: npm run release:third-party-licenses
      - run: npm run release:third-party-licenses:verify
      - run: npm run qa:web-admin-proxy-smoke
      - run: npm run qa:web-admin-bundle-token-scan
      - run: npm run qa:web-admin-sync-topology-release-smoke
      - run: npm run qa:sync:self-hosted-smoke
      - run: npm run qa:sync:release-smoke
      - run: npm run qa:sync:release-backup-restore-smoke
      - run: npm run qa:sync:config-guard-smoke
      - run: npm run qa:sync:backup-restore-smoke
      - run: node scripts/verify-sync-release-evidence.mjs
      - run: npm run qa:release-provenance
      - run: node scripts/check-public-release-readiness.mjs

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: npm
      - name: Pin npm 10.9.7
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.7
          test "$(npm --version)" = "10.9.7"
      - run: npm ci
      - run: npm run qa:lighthouse
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        continue-on-error: true
        with:
          name: lighthouse-report
          path: reports/lighthouse
          retention-days: 3
