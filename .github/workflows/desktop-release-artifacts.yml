name: Desktop Release Artifacts

on:
  workflow_dispatch:
    inputs:
      formal_evidence:
        description: "Formal signing automation is disabled; true is rejected."
        required: true
        default: false
        type: boolean
      retention_days:
        description: "Unsigned artifact retention in days."
        required: true
        default: "14"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  policy:
    name: Enforce unsigned staging policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Reject disabled formal signing
        shell: bash
        env:
          FORMAL_EVIDENCE: ${{ inputs.formal_evidence }}
          RETENTION_DAYS: ${{ inputs.retention_days }}
        run: |
          set -euo pipefail
          if [[ "${FORMAL_EVIDENCE}" == "true" ]]; then
            echo "FORMAL_SIGNING_DISABLED: Desktop formal signing and notarization automation is disabled." >&2
            exit 1
          fi
          if [[ ! "${RETENTION_DAYS}" =~ ^([1-9]|[12][0-9]|30)$ ]]; then
            echo "retention_days must be 1 through 30." >&2
            exit 1
          fi

  build-unsigned:
    name: Build unsigned Desktop ${{ matrix.platform }}
    needs:
      - policy
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2025
            runner_arch: x86_64
            bundles: nsis
          - platform: macos
            os: macos-15
            runner_arch: arm64
            bundles: dmg
          - platform: linux
            os: ubuntu-24.04
            runner_arch: x86_64
            bundles: appimage deb

    steps:
      - name: Assert unsigned runner architecture
        shell: bash
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          if [[ "${actual_arch}" != "${EXPECTED_RUNNER_ARCH}" ]]; then
            echo "Expected unsigned runner architecture ${EXPECTED_RUNNER_ARCH}, received ${actual_arch}." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2

      - name: Pin npm 10.9.7
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.7
          test "$(npm --version)" = "10.9.7"

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.96.0

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install locked dependencies
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Generate and verify Desktop legal resource
        shell: bash
        run: npm run release:desktop:legal-resource

      - name: Build unsigned Desktop bundle
        env:
          ATLASTERM_DESKTOP_RELEASE_BUNDLES: ${{ matrix.bundles }}
        run: npm run release:desktop:build

      - name: Upload unsigned Desktop bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-unsigned-bundle-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.msix
            reports/release/THIRD-PARTY-LICENSES-SHA256SUMS.txt
            reports/release/third-party-licenses/manifest.json
            reports/release/third-party-licenses/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.retention_days) }}
